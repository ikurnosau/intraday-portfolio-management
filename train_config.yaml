schema_version: 7
config_revision: 18

data:
  retriever:
    name: alpaca_markets
    params:
      use_quote_estimation: false
      exact_quote_workers: 300
      exact_quote_processes: 8
      quote_requests_per_minute: 9000
  symbols:
    - AAPL
    - ACWI
    - AMD
    - AMZN
    - APLD
    - ARKK
    - AVGO
    - B
    - BAC
    - BKNG
