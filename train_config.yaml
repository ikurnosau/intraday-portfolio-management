    - CIFR
    - CSCO
    - DIA
    - DVN
    - EEM
    - EFA
    - EMXC
    - EWT
    - EWY
    - FBTC
    - FCX
    - GDX
    - GLD
    - GOOG
    - GOOGL
    - HOOD
    - IBIT
    - IEMG
    - IGV
    - IJR
    - INTC
    - IONQ
    - IREN
    - IVV
    - IVW
    - IWF
    - IWM
    - IYR
    - KO
    - KRE
    - MARA
    - META
    - MRVL
    - MSFT
    - MSTR
    - MU
    - NEE
    - NFLX
    - NKE
    - NOW
    - NVDA
    - ORCL
    - OXY
    - PLTR
    - PYPL
    - QBTS
    - QLD
    - QQQ
    - QQQM
    - RGTI
    - RIOT
    - RKLB
    - RSP
    - SHEL
    - SLB
    - SLV
    - SMCI
    - SMH
    - SOXX
    - SPXL
    - SPY
    - SPYG
    - STM
    - TFC
    - TQQQ
    - TSLA
    - TSM
    - UBER
    - UPRO
    - USB
    - VNQ
    - VOO
    - VT
    - VTI
    - VTWO
    - VUG
    - WFC
    - WMT
    - WULF
    - XBI
    - XLC
    - XLE
    - XLI
    - XLK
    - XLP
    - XLV
    - XLY
    - XOM
  frequency:
    amount: 1
    unit: Minute
  start: "2024-11-01T00:00:00-04:00"
  end: "2026-08-01T00:00:00-04:00"
  train_set_last_date: "2026-05-01T00:00:00-04:00"
  val_set_last_date: "2026-06-01T00:00:00-04:00"
  features:
    - output: log_ret
      name: log_return
      params:
        feature: midpoint
    - output: hl_range
      name: high_low_range
    - output: close_open
      name: close_open_return
    - output: vol_delta
      name: log_volume_change
    - output: SMA_fast
      name: sma
      params:
        period: 3
        base_feature: midpoint
    - output: SMA_slow
      name: sma
      params:
        period: 30
        base_feature: midpoint
    - output: RSI2
      name: rsi
      params:
        period: 2
        base_feature: midpoint
    - output: RSI6
      name: rsi
      params:
        period: 6
        base_feature: midpoint
    - output: realvol20
      name: realized_volatility
      params:
        window: 20
        feature: midpoint
    - output: VWAP_dist
      name: rolling_vwap_distance
      params:
        period: 30
    - output: loc_in_range
      name: location_in_range
    - output: tod_sin
      name: time_of_day_cyclic
      params:
        function: sin
        offset: -0.19212672
    - output: tod_cos
      name: time_of_day_cyclic
      params:
        function: cos
        offset: 0.018629849
    - output: sma_slope
      name: moving_average_slope
      params:
        kind: SMA
        fast_period: 3
        slow_period: 15
        base_feature: midpoint
    - output: vol_slope
      name: volatility_slope
      params:
        fast_window: 10
        slow_window: 20
        feature: midpoint
    - output: is_missing
      name: column
      params:
        name: is_missing
  statistics:
    - output: next_return
      name: future_return
      params:
        horizon: 60
        feature: midpoint
    - output: volatility
      name: rolling_volatility
      params:
        window: 10
    - output: spread
      name: relative_spread
      params:
        denominator: midpoint
  target:
    name: triple_classification
    params:
      horizon: 60
      base_feature: midpoint
  normalizer:
    name: min_max_over_window
    params:
      window: 60
      fit_feature: null
  missing_values_handler:
    name: continuous_forward_fill_polars
  in_seq_len: 60
  horizon: 60
  multi_asset_prediction: true

model:
  name: temporal_spatial
  params:
    output_dim: 1
    hidden_dim: 128
    lstm_layers: 2
    bidirectional: true
    dropout: 0.2
    num_heads: 4
    use_spatial_attention: true
    asset_embed_dim: 16

train:
  loss:
    name: mse
  optimizer:
    name: adamw
    params:
      lr: 0.001
      weight_decay: 1.0e-10
      amsgrad: true
  scheduler:
    type: OneCycleLR
    max_lr: 0.003
    pct_start: 0.1
    div_factor: 25
    final_div_factor: 1000
    anneal_strategy: cos
    cycle_momentum: false
  metrics:
    - output: rmse
      name: rmse_regression
  num_epochs: 20
  early_stopping_patience: 10
  device: cuda
  cudnn_benchmark: true
  batch_size: 128
  shuffle: true
  num_workers: 8
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  save_path: ""

rl:
  trajectory_length: 12
  fee: 0.0
  spread_multiplier: 1.5
  trade_asset_count: 1
  allow_short_positions: true

observability:
  experiment_name: 1 min portfolio allocation
